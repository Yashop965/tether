name: tether
version: 1.3.1
description: >-
  Use your phone as a remote trackpad, tilt-mouse, and voice terminal for the
  host. Tether runs a LAN bridge that drives the host cursor and transcribes
  voice notes straight into a Hermes session (local Whisper, no cloud).
provides_tools:
  - tether_status
provides_commands:
  - tether-pause
python_dependencies:
  - "websockets>=12"
  - "pynput>=1.7"
  - "faster-whisper>=1"
